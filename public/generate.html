<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生成钩子视频 - 红果短剧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=10" />
</head>
<body>
  <div class="page page-generate">
    <header class="header header-compact">
      <a href="/" class="back-link">← 返回检索</a>
      <div class="brand brand-compact">
        <span class="brand-icon">🎬</span>
        <div>
          <h1 id="drama-title">钩子视频生成</h1>
          <p id="drama-meta" class="drama-meta"></p>
        </div>
      </div>
    </header>

    <section class="generate-panel">
      <h2 class="panel-title">AI 推广剪辑</h2>
      <label class="field">
        <span>片头关键词（1 秒品牌封面，白字《关键词》+ 副标题；抖音合规模式无站外搜索引导）</span>
        <input id="keyword" type="text" placeholder="例：这次可摊上事了" />
      </label>
      <div class="splash-font-row">
        <label class="field field-compact">
          <span>《关键词》字号 (px)</span>
          <input id="splash-title-font" type="number" min="48" max="220" step="2" value="120" />
        </label>
        <label class="field field-compact">
          <span>片头副标题字号 (px)</span>
          <input id="splash-subtitle-font" type="number" min="32" max="180" step="2" value="70" />
        </label>
      </div>
      <div class="splash-preview-panel">
        <button type="button" id="btn-preview-splash" class="btn-ghost">刷新片头预览</button>
        <p class="episode-status">改字号后自动刷新；生成成片使用相同字号</p>
        <img id="splash-preview" class="splash-preview-img" alt="片头标题卡预览" width="480" height="270" />
        <label class="field field-compact splash-badge-field">
          <span>封面下方文字（可选，留空不显示）</span>
          <input id="splash-badge" type="text" maxlength="24" placeholder="例如：1-5、6-30" />
        </label>
      </div>
      <p class="episode-status"><strong>AI 剪辑大师</strong>：从每集正片里只留最精彩片段，快切成约 2分30–3分30 钩子（冲突→打脸→反转→悬念），原声 1x + 丰丰漫剧推荐水印。</p>
      <label class="field field-checkbox">
        <input id="use-ai-edit" type="checkbox" checked />
        <span>AI 剪辑大师（LM Studio：自动挑最精彩镜头 + 快切；需本机已启动）</span>
      </label>
      <label class="field field-checkbox">
        <input id="use-fq-koc" type="checkbox" checked />
        <span>正片使用推广中心素材（番茄达人中心下载，不再使用红果加密原片）</span>
      </label>
      <p id="config-status" class="episode-status"></p>
    </section>

    <section class="generate-panel">
      <div class="panel-head">
        <h2 id="episode-panel-title" class="panel-title">选择剧集</h2>
        <div class="panel-actions">
          <button type="button" id="select-all" class="btn-ghost">全选</button>
          <button type="button" id="clear-all" class="btn-ghost">清空</button>
        </div>
      </div>
      <div id="episode-status" class="episode-status">正在加载分集…</div>
      <div id="episode-grid" class="episode-grid episode-grid-loading"></div>
    </section>

    <section class="generate-actions">
      <button type="button" id="btn-generate" class="btn-primary" disabled>生成钩子视频</button>
      <p id="generate-hint" class="generate-hint">AI 只留最精彩：片头 → 解说卡 → 多集快切正片（约2分30–3分30）→ 片尾</p>
    </section>

    <section id="result-panel" class="result-panel hidden">
      <h2 class="panel-title">生成结果</h2>
      <p id="result-msg" class="result-msg"></p>
      <div id="post-caption-box" class="post-caption-box hidden">
        <h3 class="post-caption-title">AI 发布文案（可复制）</h3>
        <pre id="post-caption" class="post-caption"></pre>
        <button type="button" id="btn-copy-caption" class="btn-ghost">复制文案</button>
      </div>
      <video id="preview" class="preview-video" controls playsinline></video>
      <a id="download-link" class="btn-download hidden" href="#" download="hook_video.mp4">下载推广视频（MP4）</a>
    </section>
  </div>
  <script src="/generate.js?v=38"></script>
</body>
</html>
