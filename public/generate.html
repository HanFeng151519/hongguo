<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生成钩子视频 - 红果短剧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=10" />
</head>
<body>
  <div class="page page-generate">
    <header class="header header-compact">
      <a href="/" class="back-link">← 返回检索</a>
      <div class="brand brand-compact">
        <span class="brand-icon">🎬</span>
        <div>
          <h1 id="drama-title">钩子视频生成</h1>
          <p id="drama-meta" class="drama-meta"></p>
        </div>
      </div>
    </header>

    <section class="generate-panel">
      <h2 class="panel-title">AI 推广剪辑</h2>
      <p class="episode-status"><strong>两段高光直剪</strong>：本集已剪好的正片里自动取 2 段最高光（音画分析），拼成约 30 秒钩子，原声 1x，不调用 AI。</p>
      <label class="field field-checkbox">
        <input id="use-ai-edit" type="checkbox" />
        <span>改用 AI 剪辑大师（需 LM Studio；关闭时默认两段高光直剪）</span>
      </label>
      <label class="field field-checkbox">
        <input id="use-fq-koc" type="checkbox" checked />
        <span>正片使用推广中心素材（番茄达人中心下载，不再使用红果加密原片）</span>
      </label>
      <p id="config-status" class="episode-status"></p>
    </section>

    <section class="generate-panel">
      <div class="panel-head">
        <h2 id="episode-panel-title" class="panel-title">选择剧集</h2>
        <div class="panel-actions">
          <button type="button" id="select-all" class="btn-ghost">全选</button>
          <button type="button" id="clear-all" class="btn-ghost">清空</button>
        </div>
      </div>
      <div id="episode-status" class="episode-status">正在加载分集…</div>
      <div id="episode-grid" class="episode-grid episode-grid-loading"></div>
    </section>

    <section class="generate-actions">
      <button type="button" id="btn-generate" class="btn-primary" disabled>生成钩子视频</button>
      <p id="generate-hint" class="generate-hint">两段高光直剪：每集取 2 段最高光，成片约 30 秒，原声 1x（默认不调用 AI）。</p>
    </section>

    <section id="result-panel" class="result-panel hidden">
      <h2 class="panel-title">生成结果</h2>
      <p id="result-msg" class="result-msg"></p>
      <div id="post-caption-box" class="post-caption-box hidden">
        <h3 class="post-caption-title">AI 发布文案（可复制）</h3>
        <pre id="post-caption" class="post-caption"></pre>
        <button type="button" id="btn-copy-caption" class="btn-ghost">复制文案</button>
      </div>
      <video id="preview" class="preview-video" controls playsinline></video>
      <a id="download-link" class="btn-download hidden" href="#" download="hook_video.mp4">下载推广视频（MP4）</a>
    </section>
  </div>
  <script src="/generate.js?v=38"></script>
</body>
</html>
